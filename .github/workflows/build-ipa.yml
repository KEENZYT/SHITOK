name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build for iPhone without signing
        run: |
          xcodebuild -project Shchitok.xcodeproj -scheme Shchitok \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/shchitok-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/shchitok-build/Build/Products/Release-iphoneos/Shchitok.app"
          test -f "$APP/Shchitok"
          test -f "$APP/Web/index.html"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Shchitok-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Shchitok-unsigned-iPhone-IPA
          path: Shchitok-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
